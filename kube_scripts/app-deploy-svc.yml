---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-appointment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hospital-appointment
  template:
    metadata:
      labels:
        app: hospital-appointment
    spec:
      containers:
        - name: hospital-appointment
          image: your_dockerhub_username/hospital-appointment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_APPLICATION_NAME
              value: hospital_appointment
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/hospitaldb?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

---
apiVersion: v1
kind: Service
metadata:
  name: hospital-appointment-service
spec:
  type: NodePort
  selector:
    app: hospital-appointment
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      nodePort: 30085
